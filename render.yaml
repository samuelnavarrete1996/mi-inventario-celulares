services:
  - type: web
    name: mi-inventario-samuel-navarrete
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AUTO_OPEN_BROWSER
        value: "0"
